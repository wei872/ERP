# ERP 企业管理系统 —— 一键商用部署
# 用法：
#   1. cp .env.example .env  并按需修改（至少改 JWT_SECRET / MYSQL_PASSWORD / SEED_ADMIN_PASSWORD）
#   2. docker compose up -d --build
#   3. 访问 http://<服务器IP>:8081（可用 PORT 环境变量改端口）
#
# 首次启动会自动执行 database/init.sql 与 upgrade.sql（仅当 MySQL 数据卷为空时）。

services:
  db:
    image: mysql:8.0
    container_name: erp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      # 库名由 database/*.sql 脚本固定为 erp_system，勿改
      TZ: Asia/Shanghai
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
    volumes:
      - erp-db-data:/var/lib/mysql
      # 首次初始化时按文件名顺序执行（01_→05_ 保证表结构/字典/补丁依次就绪）
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/upgrade.sql:/docker-entrypoint-initdb.d/02_upgrade.sql:ro
      - ./database/upgrade2.sql:/docker-entrypoint-initdb.d/03_upgrade2.sql:ro
      - ./database/registry_seed.sql:/docker-entrypoint-initdb.d/04_registry_seed.sql:ro
      - ./database/upgrade3.sql:/docker-entrypoint-initdb.d/05_upgrade3.sql:ro
      # 06_ 演示数据：由脚本按 SEED_DEMO_DATA 开关决定是否装载
      - ./deploy/initdb-demo.sh:/docker-entrypoint-initdb.d/06_demo.sh:ro
      - ./backend/src/main/resources/demo-data/demo_data.sql:/tmp/demo_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 默认不对外暴露 3306；如需宿主机直连调试再放开
    # ports:
    #   - "3306:3306"

  backend:
    build: ./backend
    container_name: erp-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: prod
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: erp_system
      DB_USER: root
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（至少32字符强随机串）}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build: ./frontend
    container_name: erp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  erp-db-data:
